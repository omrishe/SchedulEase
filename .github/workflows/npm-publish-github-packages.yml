name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - production

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 3️⃣ Install AWS SAM CLI (Option C)
      - name: Install AWS SAM CLI
        uses: aws-actions/aws-sam-cli-action@v1
        with:
          version: latest

      # 4️⃣ Build the backend (SAM build)
      - name: SAM Build
        run: sam build
        working-directory: ./server

      # 5️⃣ Package backend and upload to S3
      - name: SAM Package
        run: sam package \
              --s3-bucket schedule-ease-backend-bucket \
              --output-template-file packaged.yaml
        working-directory: ./server

      # 6️⃣ Deploy backend with CloudFormation
      - name: SAM Deploy
        run: sam deploy \
              --template-file packaged.yaml \
              --stack-name schedule-ease-backend-stack \
              --capabilities CAPABILITY_IAM
        working-directory: ./server
