name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - production

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Install AWS SAM CLI (linux binrary)
      - name: Install AWS SAM CLI
        run: |
          curl -Lo sam.zip "https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip"
          unzip sam.zip -d sam-installation
          sudo ./sam-installation/install --update

      # Build the backend
      - name: SAM Build
        run: sam build
        working-directory: ./server

      # Package backend and upload to S3
      - name: SAM Package
        run: sam package \
              --s3-bucket schedule-ease-backend-bucket \
              --output-template-file packaged.yaml
        working-directory: ./server

      # Deploy backend with CloudFormation
      - name: SAM Deploy
        run: sam deploy \
              --template-file packaged.yaml \
              --stack-name schedule-ease-backend-stack \
              --capabilities CAPABILITY_IAM
        working-directory: ./server
